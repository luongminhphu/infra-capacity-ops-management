# File của module Chi phí & Hợp đồng IT (file đính kèm Opex, hợp đồng, tờ trình) — gắn vào ico-app tại /data/files.
# ReadWriteOnce: một node gắn volume, các pod ico-app được xếp cùng node (podAffinity trong 04-app.yaml) nên
# 2 replica + RollingUpdate vẫn dùng chung được. Muốn các pod ở khác node (chịu hỏng node): ReadWriteMany
# (Longhorn RWX) — xem ghi chú trong 04-app.yaml. Đổi accessModes của PVC đã có cần tạo PVC mới và chép dữ liệu.
# Đưa PVC này vào kế hoạch backup (snapshot Longhorn) cùng với database.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ico-files
  namespace: cattle-monitoring-system
  labels:
    app: ico-app
spec:
  accessModes: ["ReadWriteOnce"]
  # Cụm không có StorageClass mặc định — chỉ định rõ như PVC của Postgres.
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
