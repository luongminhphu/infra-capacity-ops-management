apiVersion: apps/v1
kind: Deployment
metadata:
  name: ico-app
  namespace: cattle-monitoring-system
  labels:
    app: ico-app
spec:
  # 2 replica: web chạy trên cả hai; job nền (poll vCenter / NetBackup, cảnh báo, nhắc hạn, dọn dữ liệu)
  # chỉ chạy ở pod giữ khoá leader trên PostgreSQL (app/leader.py) — pod kia chờ và nhận việc trong ~15 s
  # khi leader tắt. Đồng bộ một nguồn giữ khoá theo nguồn trên DB, nên hai pod không bao giờ poll trùng.
  replicas: 2
  # RollingUpdate: bật pod mới, đợi readiness, rồi mới tắt pod cũ → deploy không gián đoạn.
  # Migration chạy dưới advisory lock (database.ensure_schema) nên pod cũ / mới khởi động đan xen an toàn.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: ico-app
  template:
    metadata:
      labels:
        app: ico-app
    spec:
      # PVC ico-files là ReadWriteOnce (Longhorn): chỉ gắn được vào MỘT node, nhiều pod trên cùng node dùng chung
      # được. Vì vậy các pod ico-app được xếp cùng node — đủ cho deploy không gián đoạn, chưa chịu được hỏng node.
      # Muốn chịu hỏng node: đổi ico-files sang ReadWriteMany (Longhorn RWX, cần nfs-common trên các node), xoá khối
      # podAffinity dưới đây và thay bằng podAntiAffinity (preferred) theo kubernetes.io/hostname.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: ico-app } }
              topologyKey: kubernetes.io/hostname
      # Đủ thời gian để pod đang tắt nhường khoá leader (leader.release) và trả lời nốt request.
      terminationGracePeriodSeconds: 30
      # Package GHCR private: kéo image bằng Secret ghcr-pull-secret (PAT classic, quyền read:packages),
      # tạo theo docs/huong-dan-chi-tiet.md. Package Public thì Secret không có cũng không sao — kubelet kéo ẩn danh.
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Đợi Postgres sẵn sàng trước khi app khởi động (tránh crash-loop lúc cụm vừa lên).
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h ico-postgres -p 5432 -q; do echo 'waiting for postgres'; sleep 3; done"]
      containers:
        - name: app
          # Sửa lại đúng tên image mà workflow .github/workflows/build-push.yml đã đẩy lên,
          # xem tại: https://github.com/luongminhphu?tab=packages
          image: ghcr.io/luongminhphu/infra-capacity-ops-management-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: ico-config }
            - secretRef: { name: ico-secrets }
          # Readiness: DB trả lời SELECT 1 và vòng poll còn chạy (503 khi DB lỗi / scheduler treo).
          # Liveness giữ /api/health (không I/O) để sự cố DB không làm pod bị restart oan.
          readinessProbe:
            httpGet: { path: /api/health/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          # CA của NetBackup (ConfigMap ico-nbu-ca, tạo bằng k8s/nbu-ca.sh) cho NETBACKUP_1_CA_CERT.
          volumeMounts:
            - { name: nbu-ca, mountPath: /etc/netbackup-ca, readOnly: true }
            # File đính kèm / hợp đồng / tờ trình của module Chi phí & Hợp đồng IT (SPEND_FILES_DIR).
            - { name: ico-files, mountPath: /data/files }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
      volumes:
        - name: nbu-ca
          # optional: pod vẫn chạy khi chưa tạo ConfigMap (đồng bộ NetBackup sẽ báo thiếu file CA).
          configMap: { name: ico-nbu-ca, optional: true }
        - name: ico-files
          persistentVolumeClaim: { claimName: ico-files }
---
# Khi drain node / nâng cấp cụm: luôn còn ít nhất 1 pod phục vụ.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ico-app
  namespace: cattle-monitoring-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ico-app
---
apiVersion: v1
kind: Service
metadata:
  name: ico-app
  namespace: cattle-monitoring-system
spec:
  type: NodePort
  selector:
    app: ico-app
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080   # đổi nếu 30080 đã bị chiếm trên cụm của bạn (dải hợp lệ 30000-32767)
