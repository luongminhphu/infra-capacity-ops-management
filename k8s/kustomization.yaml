apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# App đang chạy trong namespace có sẵn của cụm Rancher (RKE) — không tạo namespace mới.
namespace: cattle-monitoring-system
resources:
  - 01-configmap.yaml
  - 02-secret.yaml   # tự tạo từ 02-secret.example.yaml — không commit bản thật (.gitignore)
  - 03-postgres.yaml
  - 04-app.yaml
# ConfigMap `nbu-ca` (CA của NetBackup) tạo bằng k8s/nbu-ca.sh — không nằm trong kustomize.
