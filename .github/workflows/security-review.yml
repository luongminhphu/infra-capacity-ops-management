name: Security Review

# Claude reviews each pull request's diff for security issues and comments on the PR.
# Requires the repository secret CLAUDE_API_KEY (Settings → Secrets and variables → Actions),
# an Anthropic API key from https://console.anthropic.com.
#
# Note: this action is not hardened against prompt injection — only run it on trusted PRs.
# Pull requests from forks do not receive repository secrets, so they are skipped.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Claude Code security review
        uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          # The action's built-in default model is older; pin a current one.
          claude-model: claude-sonnet-5-5
          # Project context (threat model of this app), appended to the audit prompt.
          custom-security-scan-instructions: .github/security-review-instructions.txt
