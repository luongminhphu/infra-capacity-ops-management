version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ico_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-infra_capacity_ops}
    volumes:
      - ico_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ico_app} -d ${POSTGRES_DB:-infra_capacity_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host by default — only the `app` service needs it.
    # Uncomment for local debugging with a DB client:
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ico_app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-infra_capacity_ops}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SECRETS_KEY: ${SECRETS_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_MODE: ${AUTH_MODE:-local}
      AUTH_BREAKGLASS_USERS: ${AUTH_BREAKGLASS_USERS:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-}
      ENTRA_POST_LOGOUT_REDIRECT_URI: ${ENTRA_POST_LOGOUT_REDIRECT_URI:-}
      ENTRA_REQUIRE_MFA: ${ENTRA_REQUIRE_MFA:-if-present}
      ENTRA_ALLOWED_ROLES: ${ENTRA_ALLOWED_ROLES:-}
      ENTRA_ALLOWED_GROUPS: ${ENTRA_ALLOWED_GROUPS:-}
      ADMIN_USERS: ${ADMIN_USERS:-}
      ENTRA_ADMIN_ROLES: ${ENTRA_ADMIN_ROLES:-ICO.Admin}
      ENTRA_SPEND_VIEWER_ROLES: ${ENTRA_SPEND_VIEWER_ROLES:-ICO.Spend.Viewer}
      ENTRA_SPEND_EDITOR_ROLES: ${ENTRA_SPEND_EDITOR_ROLES:-ICO.Spend.Editor}
      ENTRA_SPEND_APPROVER_ROLES: ${ENTRA_SPEND_APPROVER_ROLES:-ICO.Spend.Approver}
      # Module Chi phí & Hợp đồng IT: file đính kèm / hợp đồng lưu trên volume ico_files
      SPEND_FILES_DIR: /data/files
      SPEND_MAX_UPLOAD_MB: ${SPEND_MAX_UPLOAD_MB:-20}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_MASK_HOSTS: ${MCP_MASK_HOSTS:-true}
      OBS_RETENTION_DAYS: ${OBS_RETENTION_DAYS:-30}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      VCENTER_1_KEY: ${VCENTER_1_KEY:-}
      VCENTER_1_NAME: ${VCENTER_1_NAME:-}
      VCENTER_1_HOST: ${VCENTER_1_HOST:-}
      VCENTER_1_USERNAME: ${VCENTER_1_USERNAME:-infra.mon@vsphere.local}
      VCENTER_1_PASSWORD: ${VCENTER_1_PASSWORD:-}
      VCENTER_1_VERIFY_SSL: ${VCENTER_1_VERIFY_SSL:-false}
      VCENTER_1_DEMO: ${VCENTER_1_DEMO:-false}

      VCENTER_2_KEY: ${VCENTER_2_KEY:-}
      VCENTER_2_NAME: ${VCENTER_2_NAME:-}
      VCENTER_2_HOST: ${VCENTER_2_HOST:-}
      VCENTER_2_USERNAME: ${VCENTER_2_USERNAME:-infra.mon@vsphere.local}
      VCENTER_2_PASSWORD: ${VCENTER_2_PASSWORD:-}
      VCENTER_2_VERIFY_SSL: ${VCENTER_2_VERIFY_SSL:-false}
      VCENTER_2_DEMO: ${VCENTER_2_DEMO:-false}

      VCENTER_3_KEY: ${VCENTER_3_KEY:-}
      VCENTER_3_NAME: ${VCENTER_3_NAME:-}
      VCENTER_3_HOST: ${VCENTER_3_HOST:-}
      VCENTER_3_USERNAME: ${VCENTER_3_USERNAME:-infra.mon@vsphere.local}
      VCENTER_3_PASSWORD: ${VCENTER_3_PASSWORD:-}
      VCENTER_3_VERIFY_SSL: ${VCENTER_3_VERIFY_SSL:-false}
      VCENTER_3_DEMO: ${VCENTER_3_DEMO:-false}

      VCENTER_4_KEY: ${VCENTER_4_KEY:-}
      VCENTER_4_NAME: ${VCENTER_4_NAME:-}
      VCENTER_4_HOST: ${VCENTER_4_HOST:-}
      VCENTER_4_USERNAME: ${VCENTER_4_USERNAME:-infra.mon@vsphere.local}
      VCENTER_4_PASSWORD: ${VCENTER_4_PASSWORD:-}
      VCENTER_4_VERIFY_SSL: ${VCENTER_4_VERIFY_SSL:-false}
      VCENTER_4_DEMO: ${VCENTER_4_DEMO:-false}

      # Veritas NetBackup (module Backup) — thêm khối 3/4 theo cùng mẫu nếu cần
      BACKUP_INITIAL_DAYS: ${BACKUP_INITIAL_DAYS:-14}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-400}
      NETBACKUP_1_KEY: ${NETBACKUP_1_KEY:-}
      NETBACKUP_1_NAME: ${NETBACKUP_1_NAME:-}
      NETBACKUP_1_HOST: ${NETBACKUP_1_HOST:-}
      NETBACKUP_1_PORT: ${NETBACKUP_1_PORT:-1556}
      NETBACKUP_1_API_KEY: ${NETBACKUP_1_API_KEY:-}
      NETBACKUP_1_USERNAME: ${NETBACKUP_1_USERNAME:-}
      NETBACKUP_1_PASSWORD: ${NETBACKUP_1_PASSWORD:-}
      NETBACKUP_1_DOMAIN_TYPE: ${NETBACKUP_1_DOMAIN_TYPE:-unixpwd}
      NETBACKUP_1_DOMAIN_NAME: ${NETBACKUP_1_DOMAIN_NAME:-}
      NETBACKUP_1_VERIFY_SSL: ${NETBACKUP_1_VERIFY_SSL:-false}
      NETBACKUP_1_CA_CERT: ${NETBACKUP_1_CA_CERT:-}
      NETBACKUP_1_API_VERSION: ${NETBACKUP_1_API_VERSION:-8.0}
      NETBACKUP_1_DEMO: ${NETBACKUP_1_DEMO:-false}

      NETBACKUP_2_KEY: ${NETBACKUP_2_KEY:-}
      NETBACKUP_2_NAME: ${NETBACKUP_2_NAME:-}
      NETBACKUP_2_HOST: ${NETBACKUP_2_HOST:-}
      NETBACKUP_2_PORT: ${NETBACKUP_2_PORT:-1556}
      NETBACKUP_2_API_KEY: ${NETBACKUP_2_API_KEY:-}
      NETBACKUP_2_USERNAME: ${NETBACKUP_2_USERNAME:-}
      NETBACKUP_2_PASSWORD: ${NETBACKUP_2_PASSWORD:-}
      NETBACKUP_2_DOMAIN_TYPE: ${NETBACKUP_2_DOMAIN_TYPE:-unixpwd}
      NETBACKUP_2_DOMAIN_NAME: ${NETBACKUP_2_DOMAIN_NAME:-}
      NETBACKUP_2_VERIFY_SSL: ${NETBACKUP_2_VERIFY_SSL:-false}
      NETBACKUP_2_CA_CERT: ${NETBACKUP_2_CA_CERT:-}
      NETBACKUP_2_API_VERSION: ${NETBACKUP_2_API_VERSION:-8.0}
      NETBACKUP_2_DEMO: ${NETBACKUP_2_DEMO:-false}
    volumes:
      - ico_files:/data/files
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  ico_pgdata:
  ico_files:
