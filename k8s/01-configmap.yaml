# Giá trị KHÔNG nhạy cảm — an toàn để commit vào git. Mọi giá trị nhạy cảm
# (mật khẩu, JWT_SECRET) nằm ở 02-secret.yaml (không commit bản điền thật).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ico-config
  namespace: cattle-monitoring-system
data:
  ADMIN_USERNAME: "admin"
  COOKIE_SECURE: "false"          # đặt "true" nếu Ingress/NodePort của bạn phục vụ qua HTTPS
  CORS_ORIGINS: "*"
  ENABLE_SCHEDULER: "true"
  POLL_INTERVAL_MINUTES: "60"
  SNAPSHOT_RETENTION_MONTHS: "36"   # giữ lịch sử snapshot vCenter 36 tháng (0 = giữ hết)
  SYNC_CONCURRENCY: "4"             # số vCenter / máy chủ backup đồng bộ song song
  # Storage criteria off by default (shared SAN + thick provisioning makes
  # datastore "% allocated" misleading); toggle in UI under "Tiêu chí đánh giá".
  INCLUDE_STORAGE: "false"

  # ---- Đăng nhập Microsoft Entra ID (SSO + MFA, qua Microsoft Entra application proxy) ----
  # AUTH_MODE: "local" (chỉ user/mật khẩu) · "both" (cả hai — dùng khi chuyển đổi) · "entra" (chỉ
  # Microsoft; tài khoản cục bộ trong AUTH_BREAKGLASS_USERS vẫn đăng nhập được để cứu hộ).
  # Khi bật Entra qua App Proxy (HTTPS) đặt COOKIE_SECURE: "true" ở trên.
  # ENTRA_CLIENT_SECRET nằm trong Secret ico-secrets. Xem docs/huong-dan-chi-tiet.md mục "Đăng nhập Microsoft Entra ID".
  AUTH_MODE: "local"
  AUTH_BREAKGLASS_USERS: "admin"
  ENTRA_TENANT_ID: ""                 # Directory (tenant) ID — GUID
  ENTRA_CLIENT_ID: ""                 # Application (client) ID của app registration App Proxy
  PUBLIC_URL: ""                      # URL ngoài của App Proxy, vd https://ico-<tenant>.msappproxy.net (đặt trước khi tạo passkey)
  FORWARDED_ALLOW_IPS: "127.0.0.1"    # IP connector App Proxy / ingress được tin X-Forwarded-*
  AUTH_LOCAL_METHOD: "both"           # passkey · both · password — tài khoản cục bộ đăng nhập bằng Passkey (Face ID / Touch ID)
  ENTRA_AUTO_REDIRECT: "false"        # "true": màn đăng nhập tự chuyển sang Microsoft khi AUTH_MODE=entra
  ENTRA_REDIRECT_URI: ""              # để trống = PUBLIC_URL/api/auth/oidc/callback
  ENTRA_POST_LOGOUT_REDIRECT_URI: ""  # https://ico.<domain>/ (tuỳ chọn)
  ENTRA_REQUIRE_MFA: "if-present"     # if-present · strict · off (MFA do Conditional Access ép buộc)
  ENTRA_ALLOWED_ROLES: ""             # tuỳ chọn: app role, vd "ICO.User,ICO.Admin"
  ENTRA_ALLOWED_GROUPS: ""            # tuỳ chọn: object ID nhóm

  # ---- Quản trị viên & MCP server (AI đọc log / hiệu suất của app, chỉ đọc) ----
  ADMIN_USERS: "admin"                # tài khoản cục bộ là admin (phân cách dấu phẩy)
  ENTRA_ADMIN_ROLES: "ICO.Admin"      # app role Entra là admin (cập nhật mỗi lần đăng nhập)
  # Module Chi phí & Hợp đồng IT: app role Entra -> vai trò Xem / Biên tập / Duyệt (cập nhật mỗi lần đăng nhập).
  # Nếu ENTRA_ALLOWED_ROLES đang giới hạn người vào app, thêm cả các role này vào đó.
  ENTRA_SPEND_VIEWER_ROLES: "ICO.Spend.Viewer"
  ENTRA_SPEND_EDITOR_ROLES: "ICO.Spend.Editor"
  ENTRA_SPEND_APPROVER_ROLES: "ICO.Spend.Approver"
  SPEND_FILES_DIR: "/data/files"      # PVC ico-files (05-files-pvc.yaml)
  SPEND_MAX_UPLOAD_MB: "20"
  MCP_ENABLED: "false"                # "true" để admin tạo token MCP trong Cài đặt → AI / MCP
  MCP_MASK_HOSTS: "true"              # che hostname / IP nội bộ trong log trả cho AI
  MCP_TOKEN_MAX_DAYS: "180"
  OBS_RETENTION_DAYS: "30"            # giữ log WARNING+ và số liệu hiệu suất 30 ngày
  OBS_SLOW_REQUEST_MS: "1000"
  OBS_SLOW_QUERY_MS: "200"

  # ---- vCenter #1..#4 — phần KHÔNG nhạy cảm ----
  # Dùng chung tài khoản read-only infra.mon@vsphere.local trên cả 4 vCenter.
  # Đặt VCENTER_i_DEMO=true (không cần HOST thật) để chạy thử với dữ liệu giả lập
  # trước khi có kết nối vCenter thật.
  VCENTER_1_KEY: "vc-hcm-01"
  VCENTER_1_NAME: "vCenter HCM DC1"
  VCENTER_1_HOST: "vcenter01.yourcompany.local"
  VCENTER_1_USERNAME: "infra.mon@vsphere.local"
  VCENTER_1_VERIFY_SSL: "false"
  VCENTER_1_DEMO: "false"

  VCENTER_2_KEY: "vc-hcm-02"
  VCENTER_2_NAME: "vCenter HCM DC2"
  VCENTER_2_HOST: "vcenter02.yourcompany.local"
  VCENTER_2_USERNAME: "infra.mon@vsphere.local"
  VCENTER_2_VERIFY_SSL: "false"
  VCENTER_2_DEMO: "false"

  VCENTER_3_KEY: "vc-dr-01"
  VCENTER_3_NAME: "vCenter DR Site"
  VCENTER_3_HOST: "vcenter03.yourcompany.local"
  VCENTER_3_USERNAME: "infra.mon@vsphere.local"
  VCENTER_3_VERIFY_SSL: "false"
  VCENTER_3_DEMO: "false"

  VCENTER_4_KEY: "vc-branch-01"
  VCENTER_4_NAME: "vCenter Branch"
  VCENTER_4_HOST: "vcenter04.yourcompany.local"
  VCENTER_4_USERNAME: "infra.mon@vsphere.local"
  VCENTER_4_VERIFY_SSL: "false"
  VCENTER_4_DEMO: "false"

  # ---- Veritas NetBackup (module Backup) — phần KHÔNG nhạy cảm ----
  # User / mật khẩu (hoặc API key) nằm trong Secret ico-secrets.
  # TLS: xác thực bằng CA của NetBackup (root "nbatd" + trung gian "broker"), lấy bằng
  # k8s/nbu-ca.sh vào ConfigMap ico-nbu-ca, mount tại /etc/netbackup-ca (xem 04-app.yaml).
  # KEY không đổi sau khi đã chạy (lịch sử job lưu theo KEY).
  BACKUP_INITIAL_DAYS: "14"
  BACKUP_RETENTION_DAYS: "400"
  NETBACKUP_1_KEY: "nbu-hsc"
  NETBACKUP_1_NAME: "NetBackup HSC"
  NETBACKUP_1_HOST: "nbu-primary.hsc.com.vn"   # FQDN trùng tên trong chứng chỉ, không dùng IP
  NETBACKUP_1_PORT: "1556"
  NETBACKUP_1_VERIFY_SSL: "true"
  NETBACKUP_1_CA_CERT: "/etc/netbackup-ca/ca.pem"
  NETBACKUP_1_API_VERSION: "8.0"
  NETBACKUP_1_DOMAIN_TYPE: "unixpwd"           # user AD: "NT" + DOMAIN_NAME là domain AD
  NETBACKUP_1_DOMAIN_NAME: "nbu-primary.hsc.com.vn"
  NETBACKUP_1_DEMO: "false"
