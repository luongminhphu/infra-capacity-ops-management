name: Tests

on:
  pull_request:
  workflow_dispatch: {}
  # Called by build-push.yml so an image is only pushed when the tests pass.
  workflow_call: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (same version as backend/Dockerfile)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # WeasyPrint (PDF reports) needs Pango/Cairo at import time — same libs as the Dockerfile.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 shared-mime-info fonts-dejavu-core

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      # tests/conftest.py points the app at a throw-away SQLite DB and a demo NetBackup server.
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests -q
