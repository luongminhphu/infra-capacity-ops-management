# Chỉ là TEMPLATE — sao chép thành `02-secret.yaml` (đã có trong .gitignore, sẽ
# KHÔNG commit vào git), điền giá trị thật rồi mới `kubectl apply -f k8s/02-secret.yaml`.
#
# Cách khác an toàn hơn (không lưu secret ra file lúc nào, kể cả trên đĩa của bạn):
#   kubectl create secret generic ico-secrets -n cattle-monitoring-system \
#     --from-literal=POSTGRES_USER=ico_app \
#     --from-literal=POSTGRES_PASSWORD='<mật khẩu Postgres>' \
#     --from-literal=POSTGRES_DB=infra_capacity_ops \
#     --from-literal=DATABASE_URL='postgresql+psycopg2://ico_app:<CÙNG mật khẩu Postgres ở trên>@ico-postgres:5432/infra_capacity_ops' \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=ADMIN_PASSWORD='<mật khẩu đăng nhập admin>' \
#     --from-literal=VCENTER_1_PASSWORD='<mật khẩu infra.mon trên vCenter 1>' \
#     --from-literal=VCENTER_2_PASSWORD='<mật khẩu infra.mon trên vCenter 2>' \
#     --from-literal=VCENTER_3_PASSWORD='<mật khẩu infra.mon trên vCenter 3>' \
#     --from-literal=VCENTER_4_PASSWORD='<mật khẩu infra.mon trên vCenter 4>' \
#     --from-literal=NETBACKUP_1_USERNAME='ita_collector_user' \
#     --from-literal=NETBACKUP_1_PASSWORD='<mật khẩu ita_collector_user trên NetBackup>'
#
# LƯU Ý: DATABASE_URL phải khớp CHÍNH XÁC với POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB
# ở trên — Kubernetes không tự nội suy biến như docker-compose.yml, đây là chuỗi tĩnh.
apiVersion: v1
kind: Secret
metadata:
  name: ico-secrets
  namespace: cattle-monitoring-system
type: Opaque
stringData:
  POSTGRES_USER: "ico_app"
  POSTGRES_PASSWORD: "change-me-strong-password"
  POSTGRES_DB: "infra_capacity_ops"

  # Phải khớp user/password/db ở trên + tên Service Postgres (ico-postgres, port 5432)
  DATABASE_URL: "postgresql+psycopg2://ico_app:change-me-strong-password@ico-postgres:5432/infra_capacity_ops"

  JWT_SECRET: "change-me-to-a-long-random-string"
  ADMIN_PASSWORD: "change-me-strong-password"

  VCENTER_1_PASSWORD: "change-me"
  VCENTER_2_PASSWORD: "change-me"
  VCENTER_3_PASSWORD: "change-me"
  VCENTER_4_PASSWORD: "change-me"

  # NetBackup (module Backup): user chỉ đọc đăng nhập /netbackup/login (domain trong ConfigMap).
  NETBACKUP_1_USERNAME: "ita_collector_user"
  NETBACKUP_1_PASSWORD: "change-me"
  # Thay cho user/mật khẩu nếu có API key (NetBackup 9.x+): xoá 2 dòng trên và dùng
  # NETBACKUP_1_API_KEY: "change-me"
