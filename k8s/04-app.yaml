apiVersion: apps/v1
kind: Deployment
metadata:
  name: ico-app
  namespace: cattle-monitoring-system
  labels:
    app: ico-app
spec:
  replicas: 1  # giữ 1 — scheduler polling vCenter chạy trong tiến trình app, tăng replicas
               # sẽ khiến nhiều pod cùng poll trùng lặp vào vCenter (không có phối hợp khoá).
  # Recreate: tắt pod cũ rồi mới bật pod mới — không có lúc hai pod cùng poll vCenter / NetBackup
  # hay cùng tạo bảng trên DB trống.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ico-app
  template:
    metadata:
      labels:
        app: ico-app
    spec:
      # Package GHCR private: kéo image bằng Secret ghcr-pull-secret (PAT classic, quyền read:packages),
      # tạo theo README. Package Public thì Secret không có cũng không sao — kubelet kéo ẩn danh.
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Đợi Postgres sẵn sàng trước khi app khởi động (tránh crash-loop lúc cụm vừa lên).
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h ico-postgres -p 5432 -q; do echo 'waiting for postgres'; sleep 3; done"]
      containers:
        - name: app
          # Sửa lại đúng tên image mà workflow .github/workflows/build-push.yml đã đẩy lên,
          # xem tại: https://github.com/luongminhphu?tab=packages
          image: ghcr.io/luongminhphu/infra-capacity-ops-management-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: ico-config }
            - secretRef: { name: ico-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          # CA của NetBackup (ConfigMap ico-nbu-ca, tạo bằng k8s/nbu-ca.sh) cho NETBACKUP_1_CA_CERT.
          volumeMounts:
            - { name: nbu-ca, mountPath: /etc/netbackup-ca, readOnly: true }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
      volumes:
        - name: nbu-ca
          # optional: pod vẫn chạy khi chưa tạo ConfigMap (đồng bộ NetBackup sẽ báo thiếu file CA).
          configMap: { name: ico-nbu-ca, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: ico-app
  namespace: cattle-monitoring-system
spec:
  type: NodePort
  selector:
    app: ico-app
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080   # đổi nếu 30080 đã bị chiếm trên cụm của bạn (dải hợp lệ 30000-32767)
